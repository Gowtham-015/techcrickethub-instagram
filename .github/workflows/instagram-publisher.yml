# Trigger production publisher cycle on GitHub Actions
name: TechCricketHub Instagram Publisher


on:
  schedule:
    # Staggered 3-times-an-hour schedule off the hour boundary
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Mode (true for Dry Run simulation, false for Real Instagram publishing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: instagram-production-publisher
  cancel-in-progress: false

jobs:
  publish-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || vars.INSTAGRAM_DRY_RUN || 'false' }}
      INSTAGRAM_PRODUCTION_ENABLED: 'true'
      INSTAGRAM_AUTOMATION_ENABLED: 'true'
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
      INSTAGRAM_TIMEZONE: 'Asia/Kolkata'
      INSTAGRAM_REEL_DISCOVERY_ENABLED: 'true'
      INSTAGRAM_REEL_TARGET_PERCENT: '100'
      INSTAGRAM_IMAGE_TARGET_PERCENT: '0'
      INSTAGRAM_IMAGE_FALLBACK_ENABLED: 'false'

    steps:
      - name: Checkout Instagram Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG INSTALLED"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "DEPENDENCIES INSTALLED"

      - name: Run Essential Validation Tests
        run: |
          python -m pytest tests/test_instagram_production_gate.py tests/test_instagram_real_video_source.py tests/test_instagram_publisher.py tests/test_instagram_reel_publisher.py -q

      - name: Run Preflight Diagnostics
        run: |
          python main.py --production-diagnostics

      - name: Phase A - Prepare Media Assets
        run: |
          python main.py --prepare-media

      - name: Commit & Push Prepared Media BEFORE Meta Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/generated_reels data/acquired_videos media/generated
          if [ -f data/prepared_media.json ]; then
            git add -f data/prepared_media.json
          fi
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Chore: commit prepared media before Meta publication [skip ci]"
            git pull origin main --rebase
            git push origin main
            echo "MEDIA COMMITTED AND PUSHED TO GITHUB RAW"
          else
            echo "No pre-run media changes to commit."
          fi

      - name: Phase B/C - Execute Meta Publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/prepared_media.json ]; then
            echo "Error: data/prepared_media.json does not exist. Aborting publication."
            exit 1
          fi
          python main.py --publish-prepared

      - name: Update Heartbeat & Cloud Status
        if: always()
        run: |
          python main.py --cloud-status

      - name: Phase D - Commit & Push Persistent History & Health Status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Chore: update published history, health status, and proof [skip ci]"
            git pull origin main --rebase
            git push origin main
            echo "STATE COMMITTED AND PUSHED"
          fi

