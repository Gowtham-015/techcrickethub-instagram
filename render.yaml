services:
  - type: worker
    name: techcrickethub-instagram-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --run
    autoDeploy: true
    envVars:
      - key: INSTAGRAM_DRY_RUN
        value: "true"
      - key: INSTAGRAM_AUTOMATION_ENABLED
        value: "true"
      - key: INSTAGRAM_SCHEDULER_ENABLED
        value: "true"
      - key: INSTAGRAM_TIMEZONE
        value: "Asia/Kolkata"
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
