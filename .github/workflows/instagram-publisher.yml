name: TechCricketHub Instagram Publisher (Phase 13.7)

on:
  schedule:
    # Runs automatically every 30 minutes 24/7 independently of local laptop
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Mode (true for Dry Run simulation, false for Real Instagram publishing)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish-job:
    runs-on: ubuntu-latest

    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || '37982406558040899' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || 'IGAAW7oCvAZBS1BZAFowdVRmMC1rOTZANS1VINkM2WUdTbjd2cHFXNUQxZAHBNOWp0UWZA5U3pvWXR6eThFNENzUmJuZA25LQ3YwZAWVSSnFDeHM0akhGbEVoQWdOZAzJWSUtjMkVtVlBMR3BBc1o2amJKTjJsS29Qb3NERGhqTGxGWGVOVQZDZD' }}
      INSTAGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || vars.INSTAGRAM_DRY_RUN || 'false' }}
      INSTAGRAM_PRODUCTION_ENABLED: 'true'
      INSTAGRAM_AUTOMATION_ENABLED: 'true'
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
      INSTAGRAM_TIMEZONE: 'Asia/Kolkata'

    steps:
      - name: Checkout Instagram Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Sync Latest State
        run: |
          git pull origin main --rebase || true

      - name: Execute Instagram Automation Cycle
        run: |
          python main.py --run-once

      - name: Commit & Push Persistent History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add -f data/*.json || true
          git commit -m "Chore: update published history [skip ci]" || true
          git push origin main || true
