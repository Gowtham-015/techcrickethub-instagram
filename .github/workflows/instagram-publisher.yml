name: TechCricketHub Instagram Publisher

on:
  schedule:
    # Staggered 3-times-an-hour schedule off the hour boundary
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Mode (true for Dry Run simulation, false for Real Instagram publishing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: instagram-production-publisher
  cancel-in-progress: false

jobs:
  publish-job:
    runs-on: ubuntu-latest

    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || vars.INSTAGRAM_DRY_RUN || 'false' }}
      INSTAGRAM_PRODUCTION_ENABLED: 'true'
      INSTAGRAM_AUTOMATION_ENABLED: 'true'
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
      INSTAGRAM_TIMEZONE: 'Asia/Kolkata'

    steps:
      - name: Checkout Instagram Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git pull origin main --rebase

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG INSTALLED"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "DEPENDENCIES INSTALLED"

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Preflight Diagnostics
        run: |
          python main.py --production-diagnostics || true

      - name: Commit & Push Generated Media BEFORE Meta Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/generated_reels/*.mp4 media/generated/*.jpg || true
          if ! git diff --staged --quiet; then
            git commit -m "Chore: commit generated media before Meta publication [skip ci]"
            git pull origin main --rebase -X ours || git pull origin main --rebase
            git push origin main
            echo "MEDIA COMMITTED AND PUSHED TO GITHUB RAW"
          fi

      - name: Execute Production Publisher Cycle
        run: |
          python main.py --run-once

      - name: Update Heartbeat & Cloud Status
        if: always()
        run: |
          python main.py --cloud-status || true

      - name: Commit & Push Persistent History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/*.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Chore: update published history and state [skip ci]"
            git pull origin main --rebase -X ours || git pull origin main --rebase
            git push origin main
            echo "STATE COMMITTED"
            echo "STATE PUSHED"
          fi

