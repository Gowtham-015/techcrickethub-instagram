# Trigger production publisher cycle on GitHub Actions
name: TechCricketHub Instagram Publisher


on:
  schedule:
    # Staggered 3-times-an-hour schedule off the hour boundary
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Mode (true for Dry Run simulation, false for Real Instagram publishing)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: instagram-production-publisher
  cancel-in-progress: false

jobs:
  publish-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || vars.INSTAGRAM_DRY_RUN || 'false' }}
      INSTAGRAM_PRODUCTION_ENABLED: 'true'
      INSTAGRAM_AUTOMATION_ENABLED: 'true'
      INSTAGRAM_SCHEDULER_ENABLED: 'true'
      INSTAGRAM_TIMEZONE: 'Asia/Kolkata'
      INSTAGRAM_REEL_DISCOVERY_ENABLED: 'true'
      INSTAGRAM_REEL_TARGET_PERCENT: '100'
      INSTAGRAM_IMAGE_TARGET_PERCENT: '0'
      INSTAGRAM_IMAGE_FALLBACK_ENABLED: 'false'

    steps:
      - name: Checkout Instagram Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG INSTALLED"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "DEPENDENCIES INSTALLED"

      - name: Run Essential Validation Tests
        run: |
          python -m pytest -q

      - name: Run Preflight Diagnostics
        run: |
          python main.py --production-diagnostics

      - name: Clean Stale Preparation State
        run: |
          rm -f data/prepared_media.json
          rm -f data/prepared_media.json.tmp
          echo "STALE PREPARATION STATE CLEANED"

      - name: Phase A - Prepare Media Assets
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python main.py --prepare-media

      - name: Verify Preparation Metadata
        if: hashFiles('data/prepared_media.json') != ''
        run: |
          python -c "
          import json, os, sys
          with open('data/prepared_media.json') as f:
              d = json.load(f)
          loc = d.get('local_file', '')
          if any(loc.startswith(p) for p in ['C:', 'D:', 'E:', 'c:', 'd:', 'e:']) or '\\\\' in loc:
              print(f'Error: Windows path contamination detected in local_file: {loc}')
              sys.exit(1)
          if not d.get('preparation_id'):
              print('Error: Missing preparation_id in metadata.')
              sys.exit(1)
          print('Prepared media metadata verification PASSED.')
          "

      - name: Commit & Push Prepared Media BEFORE Meta Publication
        if: hashFiles('data/prepared_media.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/prepared_media.json ]; then
            git add -f data/prepared_media.json
          fi
          git add data/
          if [ -d media ]; then git add media/; fi
          if ! git diff --staged --quiet; then
            git commit -m "Chore: commit prepared media before Meta publication [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
            echo "MEDIA COMMITTED AND PUSHED TO GITHUB RAW"
          else
            echo "No pre-run media changes to commit."
          fi

      - name: Verify GitHub Raw Accessibility
        if: hashFiles('data/prepared_media.json') != ''
        run: |
          python -c "
          import json, urllib.request, sys
          with open('data/prepared_media.json') as f:
              d = json.load(f)
          url = d.get('public_url', '')
          if not url or not url.startswith('http'):
              print(f'Error: Invalid public URL for Raw verification: {url}')
              sys.exit(1)
          print(f'Verifying GitHub Raw URL accessibility: {url}')
          req = urllib.request.Request(url, headers={'User-Agent': 'GitHubActions-MediaVerifier/1.0'})
          with urllib.request.urlopen(req, timeout=15) as resp:
              code = resp.getcode()
              length = resp.headers.get('Content-Length')
              ctype = resp.headers.get('Content-Type', '')
              print(f'HTTP Status: {code}, Content-Type: {ctype}, Content-Length: {length}')
              if code != 200:
                  print('Error: GitHub Raw returned non-200 status.')
                  sys.exit(1)
          print('GitHub Raw URL verification PASSED.')
          "

      - name: Phase B/C - Execute Meta Publication
        if: hashFiles('data/prepared_media.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python main.py --publish-prepared

      - name: Update Heartbeat & Cloud Status
        if: always()
        run: |
          python main.py --cloud-status

      - name: Phase D - Commit & Push Persistent History & Health Status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Chore: update published history, health status, and proof [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
            echo "STATE COMMITTED AND PUSHED"
          fi

      - name: Generate Job Summary
        if: always()
        run: |
          python -c "
          import json, os
          run_id = os.environ.get('GITHUB_RUN_ID', 'N/A')
          sha = os.environ.get('GITHUB_SHA', 'N/A')
          prep_file = 'data/prepared_media.json'
          proof_file = 'data/production_proof.json'
          
          summary = []
          summary.append('## TechCricketHub Instagram Publisher Execution Summary')
          summary.append(f'- **Run ID**: {run_id}')
          summary.append(f'- **Commit SHA**: {sha}')
          
          if os.path.exists(prep_file):
              try:
                  with open(prep_file) as f:
                      p = json.load(f)
                  summary.append(f'- **Preparation ID**: {p.get(\"preparation_id\", \"N/A\")}')
                  summary.append(f'- **Content ID**: {p.get(\"content_id\", \"N/A\")}')
                  summary.append(f'- **Category**: {p.get(\"category\", \"N/A\")}')
                  summary.append(f'- **Rights Status**: {p.get(\"media_rights_status\", \"N/A\")}')
                  summary.append(f'- **Public URL**: {p.get(\"public_url\", \"N/A\")}')
              except Exception:
                  pass

          if os.path.exists(proof_file):
              try:
                  with open(proof_file) as f:
                      pr = json.load(f)
                  summary.append(f'- **Meta Container ID**: {pr.get(\"meta_container_id\", \"N/A\")}')
                  summary.append(f'- **Instagram Media ID**: {pr.get(\"instagram_media_id\", \"N/A\")}')
                  summary.append(f'- **Permalink**: {pr.get(\"instagram_permalink\", \"N/A\")}')
                  summary.append(f'- **Live Reel Verified**: {pr.get(\"live_reel_verified\", False)}')
              except Exception:
                  pass

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a') as sf:
                  sf.write('\n'.join(summary) + '\n')
          "


